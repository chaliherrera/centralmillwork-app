<title>Life of a Deal — The journey, live</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#F6F4EE;--ink:#1c1917;--muted:#78716c;--line:#e7e3d8;--forest:#3b4233;--gold:#9B7200;--emerald:#059669;--card:#ffffff}
  body{background:var(--bg);font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
  #wrap{width:min(1000px,96vw)}
  #stage{position:relative;background:var(--bg);display:flex;flex-direction:column;aspect-ratio:1000/610;padding:clamp(14px,2.6vw,28px) clamp(16px,3.4vw,34px);container-type:inline-size}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .brand{font-weight:800;letter-spacing:-.3px;font-size:clamp(13px,1.6cqi,15px);color:var(--forest)}
  .brand b{color:var(--gold)}
  .sub{font-size:clamp(10px,1.3cqi,12px);color:var(--muted)}
  .dots{margin-left:auto;display:flex;gap:5px}
  .dots i{width:7px;height:7px;border-radius:50%;background:#d6d3d1;transition:.3s}
  .dots i.on{background:var(--forest);transform:scale(1.25)}
  .road{position:relative;margin:clamp(18px,3cqi,30px) 6px 6px}
  .line{position:absolute;left:5%;right:5%;top:26px;height:3px;background:#ddd8cc;border-radius:3px}
  .fill{position:absolute;left:5%;top:26px;height:3px;background:var(--forest);border-radius:3px;width:0;transition:width .8s ease}
  .stations{position:relative;display:flex;justify-content:space-between}
  .st{width:11%;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
  .node{width:clamp(38px,5.2cqi,52px);height:clamp(38px,5.2cqi,52px);border-radius:50%;background:#fff;border:2.5px solid #d6d3d1;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,2cqi,19px);color:#a8a29e;transition:.5s;z-index:2}
  .st.done .node{background:var(--emerald);border-color:var(--emerald);color:#fff}
  .st.active .node{border-color:var(--forest);color:var(--forest);box-shadow:0 0 0 7px rgba(59,66,51,.12)}
  .st .lbl{font-size:clamp(10px,1.3cqi,11.5px);font-weight:600;color:#a8a29e;margin-top:9px;transition:.4s}
  .st.done .lbl{color:var(--emerald)} .st.active .lbl{color:var(--forest)}
  .actor{position:absolute;top:-32px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(9px,1.2cqi,11px);font-weight:700;color:#fff;border-radius:20px;padding:3px 10px;opacity:0;transition:.4s}
  .st.active .actor{opacity:1}
  .actor:after{content:"";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:inherit}
  .curvewrap{margin:clamp(8px,1.8cqi,14px) 6px 0;height:clamp(44px,7cqi,66px)}
  .curvewrap svg{width:100%;height:100%;display:block}
  .cap{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(12px,2.2cqi,18px) clamp(14px,2.6vw,22px);box-shadow:0 1px 4px rgba(0,0,0,.05),0 12px 30px rgba(0,0,0,.05);transition:.3s}
  .cap .who{display:inline-flex;align-items:center;gap:7px;font-size:clamp(10px,1.4cqi,12px);font-weight:700;color:#fff;border-radius:20px;padding:4px 12px;margin-bottom:8px}
  .cap .ttl{font-size:clamp(17px,2.6cqi,21px);font-weight:800;letter-spacing:-.3px;line-height:1.2;text-wrap:balance}
  .cap .det{font-size:clamp(12px,1.6cqi,14px);color:var(--muted);margin-top:5px;line-height:1.45}
  .cap .hito{display:inline-flex;align-items:center;gap:5px;font-size:clamp(10px,1.3cqi,11px);font-weight:700;background:#ecfdf5;color:#047857;border-radius:20px;padding:3px 10px;margin-top:9px}
  .intro .ttl{font-size:clamp(20px,3.4cqi,27px)} .intro .det{font-size:clamp(13px,1.9cqi,15px)}
  .controls{display:flex;gap:8px;justify-content:center;margin-top:14px}
  .controls button{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;color:var(--forest);font-weight:600}
  .controls button:hover{background:#faf8f2}
  .controls button:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div id="wrap">
  <div id="stage">
    <div class="top">
      <span class="brand">Life of a <b>Deal</b></span>
      <span class="sub">— the journey of a project, live</span>
      <span class="dots" id="dots"></span>
    </div>
    <div class="road"><div class="line"></div><div class="fill" id="fill"></div><div class="stations" id="stations"></div></div>
    <div class="curvewrap"><svg id="curve" viewBox="0 0 1000 66" preserveAspectRatio="none"></svg></div>
    <div class="cap" id="cap"></div>
  </div>
  <div class="controls"><button id="btnPlay" type="button">⏸ Pause</button><button id="btnRestart" type="button">↻ Restart</button></div>
</div>

<script>
const FASES=[{k:'CONTRATO',lbl:'Contract'},{k:'INGENIERIA',lbl:'Engineering'},{k:'MATERIALES',lbl:'Materials'},{k:'PRODUCCION',lbl:'Production'},{k:'QC',lbl:'QC'},{k:'DESPACHO',lbl:'Shipping'},{k:'INSTALACION',lbl:'Install'},{k:'CIERRE',lbl:'Closeout'}];
const ACT={estimacion:{n:'Estimating',c:'#57534e'},contabilidad:{n:'Accounting',c:'#9B7200'},ingenieria:{n:'Engineering',c:'#4338ca'},cliente:{n:'Client',c:'#1d4ed8'},compras:{n:'Purchasing',c:'#b45309'},recepcion:{n:'Receiving',c:'#b45309'},taller:{n:'Shop',c:'#059669'},qc:{n:'Quality Control',c:'#0d9488'},sistema:{n:'The system',c:'#3b4233'}};
const STEPS=[
 {intro:true,done:[],active:null,actor:null,ttl:'A project enters the system',det:'Committed delivery: December 15. The system schedules every milestone backward from it, and follows the journey live.'},
 {done:[],active:'CONTRATO',actor:'estimacion',hito:'C-03 · Contract signed',ttl:'The contract is signed',det:'Estimating uploads the signed PDF. This is day zero: from here, the clock runs.'},
 {done:[],active:'CONTRATO',actor:'contabilidad',hito:'C-04 · Down Payment',ttl:'Accounting records the down payment',det:'The payment received is recorded (USD 25,000), with amount and author. Real evidence, not a checkbox.'},
 {done:['CONTRATO'],active:'INGENIERIA',actor:'ingenieria',hito:'E-06 · Drawings issued',ttl:'Engineering issues the shop drawings',det:'It uploads the drawings (Rev A). The milestone completes itself, and the client can already see them in their portal.'},
 {done:['CONTRATO'],active:'INGENIERIA',actor:'cliente',hito:'E-07 · Drawings approved',ttl:'The client approves the drawings',det:'From their portal, on the real document. Their response is recorded with date and name.'},
 {done:['CONTRATO'],active:'INGENIERIA',actor:'ingenieria',hito:'E-10 · Release · E-11 · CNC',ttl:'Release to production and CNC files',det:'Engineering releases the approved drawings and delivers the CNC files to the shop.'},
 {done:['CONTRATO','INGENIERIA'],active:'MATERIALES',actor:'compras',hito:'M-05 · POs issued',ttl:'Purchasing issues the purchase orders',det:'The system picks it up on its own, from the POs Purchasing already logs day to day. No extra work.'},
 {done:['CONTRATO','INGENIERIA'],active:'MATERIALES',actor:'recepcion',hito:'M-07 · Material 100%',ttl:'Material arrives at the shop',det:'Receiving is closed and the milestone completes itself. The schedule learns what actually happens.'},
 {done:['CONTRATO','INGENIERIA','MATERIALES'],active:'PRODUCCION',actor:'sistema',hito:'P-01 · Production Intake',gate:true,ttl:'Production STARTS',det:'All five conditions are met: samples, drawings, release, CNC and material. Only then does the system allow production to open.'},
 {done:['CONTRATO','INGENIERIA','MATERIALES'],active:'PRODUCCION',actor:'taller',hito:'P-05 · Fabrication',ttl:'The shop fabricates',det:'The kiosk records progress by station, in real time. Every piece adds to the progress.'},
 {done:['CONTRATO','INGENIERIA','MATERIALES','PRODUCCION'],active:'QC',actor:'qc',hito:'QC-02 · QC approved',ttl:'Quality control approves',det:'Final inspection with photos of every item. Fabrication is validated.'},
 {done:['CONTRATO','INGENIERIA','MATERIALES','PRODUCCION','QC'],active:null,actor:null,closing:true,ttl:'From Contract to QC, live',det:'Every milestone, with its owner and its evidence. The journey map reflects it instantly — and the journey continues to delivery.'}
];
function healthFor(s){return FASES.map(f=>s.done.includes(f.k)?0.9:(s.active===f.k?0.62:0.42));}
function smooth(xs,ys){let d='M '+xs[0]+' '+ys[0];for(let i=1;i<xs.length;i++){const cx=(xs[i-1]+xs[i])/2;d+=' C '+cx+' '+ys[i-1]+' '+cx+' '+ys[i]+' '+xs[i]+' '+ys[i];}return d;}
const stationsEl=document.getElementById('stations');
FASES.forEach(f=>{const d=document.createElement('div');d.className='st';d.dataset.k=f.k;d.innerHTML='<div class="actor"></div><div class="node">●</div><div class="lbl">'+f.lbl+'</div>';stationsEl.appendChild(d);});
const dotsEl=document.getElementById('dots');STEPS.forEach(()=>dotsEl.appendChild(document.createElement('i')));
const N=FASES.length,W=1000,PAD=60,xs=FASES.map((_,i)=>PAD+(W-2*PAD)*i/(N-1));
function render(i){
  const s=STEPS[i];
  [...dotsEl.children].forEach((d,j)=>d.classList.toggle('on',j===i));
  [...stationsEl.children].forEach(el=>{const k=el.dataset.k,done=s.done.includes(k),active=s.active===k;el.classList.toggle('done',done);el.classList.toggle('active',active);el.querySelector('.node').textContent=done?'✓':'●';const a=el.querySelector('.actor');if(active&&s.actor){a.textContent=ACT[s.actor].n;a.style.background=ACT[s.actor].c;}else a.textContent='';});
  let lastDone=-1;FASES.forEach((f,j)=>{if(s.done.includes(f.k))lastDone=j;});
  const activeIdx=s.active?FASES.findIndex(f=>f.k===s.active):lastDone;
  document.getElementById('fill').style.width=(Math.max(0,activeIdx)/(N-1)*90)+'%';
  const ys=healthFor(s).map(h=>60-(60-8)*h),path=smooth(xs,ys);
  document.getElementById('curve').innerHTML='<rect x="0" y="52" width="1000" height="14" fill="#fdecec"/><path d="'+path+' L '+xs[N-1]+' 66 L '+xs[0]+' 66 Z" fill="#3b423311"/><path d="'+path+'" fill="none" stroke="#3b4233" stroke-width="2"/>'+FASES.map((f,j)=>{const done=s.done.includes(f.k),active=s.active===f.k,c=done?'#059669':active?'#3b4233':'#d6d3d1';return '<circle cx="'+xs[j]+'" cy="'+ys[j]+'" r="4.5" fill="#fff" stroke="'+c+'" stroke-width="2.5"/>';}).join('');
  const cap=document.getElementById('cap');cap.className='cap'+(s.intro||s.closing?' intro':'');
  const who=s.actor?'<span class="who" style="background:'+ACT[s.actor].c+'">'+ACT[s.actor].n+'</span>':'';
  cap.innerHTML=who+'<div class="ttl">'+(s.gate?'🔒 ':'')+s.ttl+'</div><div class="det">'+s.det+'</div>'+(s.hito?'<div class="hito">✓ '+s.hito+'</div>':'');
}
const params=new URLSearchParams(location.search);
if(params.has('f')){render(parseInt(params.get('f'))||0);}
else{
  let i=0,playing=true,timer=null;const STEP_MS=3800;
  function tick(){render(i);i=(i+1)%STEPS.length;}
  function play(){tick();timer=setInterval(tick,STEP_MS);}
  document.getElementById('btnPlay').onclick=function(){playing=!playing;if(playing){this.textContent='⏸ Pause';play();}else{clearInterval(timer);this.textContent='▶ Play';}};
  document.getElementById('btnRestart').onclick=function(){clearInterval(timer);i=0;render(0);this.blur();if(playing){i=1;timer=setInterval(tick,STEP_MS);}};
  render(0);i=1;play();
}
</script>
